[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-llm-engineering"
version = "0.1.0"
description = "A hands-on, open-source course for building language models and agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
